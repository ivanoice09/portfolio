<div class="nav-space">
    <nav class="nav-container" [class.scrolled]="isScrolled">
        <div class="left-side">
            @for (section of sections; track $index) {
                <button
                    type="button"
                    class="btn-nav"
                    [class.active]="activeSection() === section.id"
                    [attr.aria-label]="section.label"
                    (click)="scrollTo(section.id)"
                >
                    <span>{{ section.label | translate }}</span>
                </button>
            }
        </div>
        <div class="right-side">
            <button type="button" (click)="switchLanguage('en')">EN</button>
            <button type="button" (click)="switchLanguage('it')">IT</button>
        </div>
    </nav>
</div>
